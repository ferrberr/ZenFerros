[package]
name = "zen-compiler"
version = "0.1.0"
edition = "2021"
description = "Zen bootstrap compiler with a checked frontend and native C backend"
readme = "../../README.md"

[lib]
name = "zen_compiler"
path = "src/lib.rs"

[[bin]]
name = "zen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
phf = { version = "0.11", features = ["macros"] }
anyhow = "1.0"
codespan-reporting = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
